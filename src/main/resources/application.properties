# Spring Boot Server Configuration
server.port=8081

# MongoDB Configuration - Local Docker MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/rideshare
spring.data.mongodb.database=rideshare

# JWT Configuration
rideshare.jwt.secret=your-very-long-secret-key-should-be-at-least-256-bits-for-hs256-algorithm
rideshare.jwt.expirationMs=3600000

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.example.rideshare=DEBUG
